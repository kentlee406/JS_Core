<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>執行環境與執行堆疊</title>
  </head>
  <body>
    <script>
      // 全域環境
      console.log(window);
      console.log(this);

      // 執行堆疊
      function f1() {
        console.log("f1");
      }
      function f2() {
        console.log("f2 start");
        f1();
        console.log("f2 end");
      }
      f2();
    </script>
  </body>
</html>
